<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin | Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main">

        <div class="visuals">
            <div class="image">
                <img src="photos/halie-west-25xggax4bSA-unsplash.jpg" alt="Green fern leaves">
            </div>

            <div id="logo">
                <img src="photos/odin-lined.png" alt="Odin logo">
                <span id="odin-text">ODIN</span>
            </div>

            <p id="photographer">Photo by <a href="#">Halie West</a> on <a href="#">Unsplash</a></p>
        </div>

        <div class="content">

            <div class="information">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</p>

                <p>You <em>know</em> you want to.</p>
            </div>

            <form action="#" method="post">

                <div class="form">
                    <h2>Let's do this!</h2>

                    <div class="fields">

                        <div class="form-label first-name">
                            <label for="first-name">First name</label>
                            <input type="text" id="first-name" name="first-name" placeholder="Thor" required>
                        </div>

                        <div class="form-label last-name">
                            <label for="last-name">Last name</label>
                            <input type="text" id="last-name" name="last-name" placeholder="Odinson" required>
                        </div>

                        <div class="form-label email">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="xyz@email.com" required>
                        </div>

                        <div class="form-label phone-number">
                            <label for="contact">Phone number</label>
                            <input type="tel" id="contact" name="contact">
                        </div>

                        <div class="form-label password">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required
                                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}$"
                                title="8-20 characters with an uppercase letter, a lowercase letter, a number and one of @$!%*?&">
                        </div>

                        <div class="form-label password-confirm">
                            <label for="password-confirm">Confirm password</label>
                            <input type="password" id="password-confirm" name="password-confirm" required
                                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}$"
                                title="Must match your password">
                        </div>

                    </div>
                </div>

                <div class="login">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </div>

            </form>

        </div>

    </main>

</body>

</html>
